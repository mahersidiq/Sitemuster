name: deploy-backend

# Database migrations and Edge Functions to the hosted staging or production Supabase project
# (Milestone 13; decision #149; docs/release/runbooks.md). Started by hand only. It fails closed
# without its credentials, deploys only a commit whose required CI passed, deploys production only
# from main, and only ever moves the database forward: `supabase db push` applies new migrations
# and never resets or deletes data. Edge Function secrets are set by the owner with
# `supabase secrets set` and never pass through GitHub (HUMAN_CHECKLIST §3).
"on":
  workflow_dispatch:
    inputs:
      target:
        description: Hosted Supabase project to update
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Production deploys come from main only
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production is deployed only from main (this run: ${GITHUB_REF})."
          exit 1
      - name: Required CI passed on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in code-quality database; do
            passed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=${check}" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
            if [ "${passed:-0}" -lt 1 ]; then
              echo "::error::Required check '${check}' has not passed on ${GITHUB_SHA}. Nothing was deployed."
              exit 1
            fi
          done

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Deployment credentials are configured (fail closed)
        run: |
          missing=""
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || missing="${missing} SUPABASE_ACCESS_TOKEN (secret)"
          [ -n "${SUPABASE_DB_PASSWORD}" ] || missing="${missing} SUPABASE_DB_PASSWORD (secret)"
          [ -n "${SUPABASE_PROJECT_REF}" ] || missing="${missing} SUPABASE_PROJECT_REF (variable)"
          if [ -n "${missing}" ]; then
            echo "::error::Not configured in this GitHub environment:${missing}. Nothing was deployed (HUMAN_CHECKLIST §3)."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read pinned Supabase CLI version
        id: sbver
        run: |
          v="$(tr -d '[:space:]' < supabase/.cli-version)"
          [ -n "$v" ] && [ "$v" != "latest" ] || { echo "::error::supabase/.cli-version must pin a version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.sbver.outputs.version }}
      - name: Node (Edge Functions import lockfile-pinned modules, decision #63)
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Link the hosted project
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"
      - name: Migrations that will be applied
        run: supabase db push --dry-run --password "${SUPABASE_DB_PASSWORD}"
      - name: Apply migrations (forward only, never a reset)
        run: supabase db push --password "${SUPABASE_DB_PASSWORD}"
      - name: Deploy every Edge Function (JWT verification per supabase/config.toml)
        run: supabase functions deploy --project-ref "${SUPABASE_PROJECT_REF}"
      - name: What is deployed now
        run: |
          supabase migration list --password "${SUPABASE_DB_PASSWORD}"
          supabase functions list --project-ref "${SUPABASE_PROJECT_REF}"
